# Fabrique l'application Android (APK) à chaque mise à jour du jeu
# et la publie dans la release « android » du dépôt.
name: APK Android

on:
  push:
    branches: [main]
    paths: ['index.html', 'vendor/**', 'icons/**', 'manifest.webmanifest', 'sw.js', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer le jeu
        run: |
          mkdir -p app/www
          cp -r index.html sw.js manifest.webmanifest vendor icons app/www/

      - name: Créer le projet Capacitor
        working-directory: app
        run: |
          npm init -y >/dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.hakanhoti.ninjadestoits",
            "appName": "Ninja des Toits",
            "webDir": "www",
            "backgroundColor": "#1d1730"
          }
          JSON
          npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Icône de l'application
        working-directory: app/android/app/src/main/res
        run: |
          rm -rf mipmap-anydpi-v26
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$d"
            cp ../../../../../www/icons/icon-192.png "$d/ic_launcher.png"
            cp ../../../../../www/icons/icon-192.png "$d/ic_launcher_round.png"
          done
          cp ../../../../../www/icons/icon-512.png mipmap-xxxhdpi/ic_launcher.png
          cp ../../../../../www/icons/icon-512.png mipmap-xxxhdpi/ic_launcher_round.png

      - name: Compiler l'APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk ninja-des-toits.apk
          gh release view android >/dev/null 2>&1 || gh release create android \
            --title "Ninja des Toits pour Android" \
            --notes "Télécharge ninja-des-toits.apk sur ton téléphone Android, ouvre-le et autorise l'installation. Ce fichier est mis à jour à chaque nouvelle version du jeu."
          gh release upload android ninja-des-toits.apk --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: ninja-des-toits-apk
          path: ninja-des-toits.apk
